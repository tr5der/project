<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent Shell — Sign in</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="login"><main class="login-card"><div class="eyebrow">AGENT WORKSPACE</div><h1>Sign in</h1><p>Secure access to your agent dashboard.</p><form action="/login" method="post"><input type="hidden" name="csrf" value="{{csrf}}"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Sign in</button></form>{% if error %}<div class="error" role="alert">{{error}}</div>{% endif %}<small>One active session per account. Use EXIT to release your session.</small></main></body></html>
